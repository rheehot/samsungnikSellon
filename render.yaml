services:
  # Worker Service (주가 모니터링)
  - type: worker
    name: stock-monitor-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: EMAIL_ENABLED
        value: true

# Cron Jobs (매일 아침 8시 KST 실행)
crons:
  - name: daily-stock-check
    service: stock-monitor-worker
    command: python -m src.main
    schedule: "0 8 * * *"
    timezone: Asia/Seoul
